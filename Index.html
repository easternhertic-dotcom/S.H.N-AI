<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.H.N — Signal Terminal</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --terminal-bg: #111827;
            --text-main: #f3f4f6;
            --accent-green: #10b981;
            --border-color: #374151;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .terminal-container {
            width: 100%;
            max-width: 800px;
            background-color: var(--terminal-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 90vh;
        }

        .terminal-header {
            background-color: #1f2937;
            padding: 10px 15px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .model-selector select {
            background-color: #374151;
            color: white;
            border: 1px solid var(--border-color);
            padding: 5px;
            border-radius: 4px;
        }

        .terminal-body {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        .system-msg { color: #9ca3af; font-style: italic; }
        .user-msg { color: #60a5fa; margin-top: 10px; }
        .shn-msg { color: var(--accent-green); margin-top: 10px; }

        .setup-panel {
            background-color: #1f2937;
            padding: 15px;
            border-top: 1px solid var(--border-color);
        }

        .input-area {
            display: flex;
            padding: 15px;
            border-top: 1px solid var(--border-color);
            background-color: #1f2937;
        }

        .input-area textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            resize: none;
            outline: none;
            font-family: inherit;
        }

        .btn {
            background-color: var(--accent-green);
            color: white;
            border: none;
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="terminal-container">
    <!-- Header -->
    <div class="terminal-header">
        <div><strong># S.H.N</strong> <span style="font-size: 12px; color: #9ca3af;">by Eastern Hertic</span></div>
        <div class="model-selector">
            <select id="modelSelect">
                <option value="llama-3.3-70b-versatile">llama-3.3-70b-versatile</option>
                <option value="llama-3.1-8b-instant">llama-3.1-8b-instant</option>
                <option value="deepseek-r1-distill-70b">deepseek-r1-distill-70b</option>
            </select>
        </div>
    </div>

    <!-- Chat Display -->
    <div class="terminal-body" id="terminalBody">
        <div class="system-msg">>_ No transmission yet. Paste your Groq API key under Setup, then ask S.H.N a coding question.</div>
    </div>

    <!-- API Key Setup (Stored locally and securely) -->
    <div class="setup-panel" id="setupPanel">
        <label for="apiKey">Groq API Key:</label>
        <input type="password" id="apiKey" placeholder="gsk_..." style="width: 70%; padding: 5px;">
        <button class="btn" onclick="saveKey()">Save Key</button>
    </div>

    <!-- Input Bar -->
    <div class="input-area">
        <textarea id="userInput" placeholder="Ask S.H.N a coding question... (Press Enter)"></textarea>
        <button class="btn" onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    // Load key on startup
    window.onload = function() {
        if(localStorage.getItem('shn_groq_key')) {
            document.getElementById('apiKey').value = localStorage.getItem('shn_groq_key');
            appendSystemMessage("Secure API Key loaded from local browser session storage.");
        }
    }

    function saveKey() {
        const key = document.getElementById('apiKey').value;
        localStorage.setItem('shn_groq_key', key);
        alert("Key saved securely to this local session!");
    }

    function appendSystemMessage(text) {
        const body = document.getElementById('terminalBody');
        body.innerHTML += `<div class="system-msg">> ${text}</div>`;
        body.scrollTop = body.scrollHeight;
    }

    async function sendMessage() {
        const inputElement = document.getElementById('userInput');
        const prompt = inputElement.value.trim();
        const apiKey = localStorage.getItem('shn_groq_key');
        const selectedModel = document.getElementById('modelSelect').value;

        if(!prompt) return;
        if(!apiKey) {
            alert("Please enter and save your Groq API key in the Setup panel first.");
            return;
        }

        const body = document.getElementById('terminalBody');
        body.innerHTML += `<div class="user-msg"><strong>You:</strong> ${prompt}</div>`;
        inputElement.value = '';

        // API Integration Logic straight from the browser to Groq endpoint
        try {
            const response = await fetch('https://groq.com', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${apiKey}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    model: selectedModel,
                    messages: [{ role: 'user', content: prompt }]
                })
            });

            const data = await response.json();
            const reply = data.choices[0].message.content;
            body.innerHTML += `<div class="shn-msg"><strong>S.H.N:</strong> ${reply}</div>`;
        } catch (error) {
            body.innerHTML += `<div class="system-msg" style="color: #ef4444;">Error processing transmission: Check network or API Key stability.</div>`;
        }
        body.scrollTop = body.scrollHeight;
    }

    // Capture Enter key event
    document.getElementById('userInput').addEventListener('keydown', function(e) {
        if(e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });
</script>

</body>
</html>
